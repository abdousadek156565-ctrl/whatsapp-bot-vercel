<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Bot Dashboard - Vercel</title>
    
    <!-- Bootstrap & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }
        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .card-header {
            background: linear-gradient(135deg, #432323 0%, #5a3a3a 100%);
            color: white;
            border-radius: 15px 15px 0 0 !important;
            padding: 1.5rem;
        }
        .btn-primary {
            background: linear-gradient(135deg, #432323 0%, #5a3a3a 100%);
            border: none;
            border-radius: 8px;
            padding: 0.75rem 1.5rem;
            font-weight: 500;
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #5a3a3a 0%, #432323 100%);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(67, 35, 35, 0.3);
        }
        .alert {
            border: none;
            border-radius: 10px;
        }
        .form-control, .form-select {
            border-radius: 8px;
            border: 2px solid #e9ecef;
            padding: 0.75rem;
        }
        .form-control:focus, .form-select:focus {
            border-color: #432323;
            box-shadow: 0 0 0 0.2rem rgba(67, 35, 35, 0.25);
        }
        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }
        .status-connected { background-color: #28a745; }
        .status-disconnected { background-color: #dc3545; }
        .status-connecting { background-color: #ffc107; animation: pulse 1s infinite; }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <div class="d-flex justify-content-between align-items-center">
                            <div class="d-flex align-items-center">
                                <i class="fas fa-robot fa-2x me-3"></i>
                                <div>
                                    <h2 class="mb-0">WhatsApp AI Bot</h2>
                                    <small class="opacity-75">Vercel Deployment</small>
                                </div>
                            </div>
                            <div id="status-display">
                                <span class="status-indicator status-disconnected"></span>
                                <span id="status-text">Disconnected</span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="card-body">
                        <!-- Status Section -->
                        <div class="row mb-4">
                            <div class="col-12">
                                <div id="status-container" class="alert alert-info">
                                    <i class="fas fa-info-circle me-2"></i>
                                    <span id="connection-status">Checking connection...</span>
                                </div>
                            </div>
                        </div>

                        <!-- QR Code Section -->
                        <div id="qr-section" class="row mb-4 d-none">
                            <div class="col-12">
                                <div class="card">
                                    <div class="card-header">
                                        <h5 class="mb-0"><i class="fas fa-qrcode me-2"></i>Scan QR Code</h5>
                                    </div>
                                    <div class="card-body text-center">
                                        <div id="qr-code-container">
                                            <p>Loading QR code...</p>
                                        </div>
                                        <p class="text-muted mt-3">
                                            Open WhatsApp on your phone and scan this QR code to connect
                                        </p>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Control Buttons -->
                        <div class="row mb-4">
                            <div class="col-12">
                                <div class="d-flex gap-2 flex-wrap">
                                    <button id="start-btn" class="btn btn-primary">
                                        <i class="fas fa-play me-2"></i>Start Bot
                                    </button>
                                    <button id="stop-btn" class="btn btn-danger" disabled>
                                        <i class="fas fa-stop me-2"></i>Stop Bot
                                    </button>
                                    <button id="refresh-btn" class="btn btn-secondary">
                                        <i class="fas fa-refresh me-2"></i>Refresh Status
                                    </button>
                                </div>
                            </div>
                        </div>

                        <!-- Send Message Section -->
                        <div class="row mb-4">
                            <div class="col-12">
                                <div class="card">
                                    <div class="card-header">
                                        <h5 class="mb-0"><i class="fas fa-paper-plane me-2"></i>Send Test Message</h5>
                                    </div>
                                    <div class="card-body">
                                        <div class="row">
                                            <div class="col-md-6 mb-3">
                                                <label for="phone-number" class="form-label">Phone Number</label>
                                                <input type="text" class="form-control" id="phone-number" 
                                                       placeholder="e.g., 201234567890" />
                                            </div>
                                            <div class="col-md-6 mb-3">
                                                <label for="test-message" class="form-label">Message</label>
                                                <input type="text" class="form-control" id="test-message" 
                                                       placeholder="Enter test message" />
                                            </div>
                                        </div>
                                        <button id="send-message-btn" class="btn btn-primary" disabled>
                                            <i class="fas fa-paper-plane me-2"></i>Send Message
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Knowledge Base Section -->
                        <div class="row mb-4">
                            <div class="col-12">
                                <div class="card">
                                    <div class="card-header">
                                        <h5 class="mb-0"><i class="fas fa-brain me-2"></i>Knowledge Base</h5>
                                    </div>
                                    <div class="card-body">
                                        <textarea id="knowledge-base" class="form-control mb-3" rows="8" 
                                                  placeholder="Enter knowledge base content..."></textarea>
                                        <div class="d-flex gap-2">
                                            <button id="load-kb-btn" class="btn btn-outline-primary">
                                                <i class="fas fa-download me-2"></i>Load KB
                                            </button>
                                            <button id="save-kb-btn" class="btn btn-primary">
                                                <i class="fas fa-save me-2"></i>Save KB
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Message Log -->
                        <div class="row">
                            <div class="col-12">
                                <div class="card">
                                    <div class="card-header d-flex justify-content-between align-items-center">
                                        <h5 class="mb-0"><i class="fas fa-list me-2"></i>Activity Log</h5>
                                        <button id="clear-log-btn" class="btn btn-sm btn-outline-secondary">
                                            <i class="fas fa-trash me-1"></i>Clear
                                        </button>
                                    </div>
                                    <div class="card-body">
                                        <div id="message-log" style="height: 300px; overflow-y: auto; background: #f8f9fa; padding: 1rem; border-radius: 8px;">
                                            <div class="text-muted text-center">
                                                <i class="fas fa-info-circle me-2"></i>
                                                Activity log will appear here...
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Custom JavaScript -->
    <script>
        let isConnected = false;
        let checkInterval;

        // DOM Elements
        const statusContainer = document.getElementById('status-container');
        const statusText = document.getElementById('connection-status');
        const statusDisplay = document.getElementById('status-display');
        const statusIndicator = statusDisplay.querySelector('.status-indicator');
        const statusTextSpan = document.getElementById('status-text');
        const qrSection = document.getElementById('qr-section');
        const qrContainer = document.getElementById('qr-code-container');
        const messageLog = document.getElementById('message-log');

        // Buttons
        const startBtn = document.getElementById('start-btn');
        const stopBtn = document.getElementById('stop-btn');
        const refreshBtn = document.getElementById('refresh-btn');
        const sendMessageBtn = document.getElementById('send-message-btn');
        const loadKbBtn = document.getElementById('load-kb-btn');
        const saveKbBtn = document.getElementById('save-kb-btn');
        const clearLogBtn = document.getElementById('clear-log-btn');

        // Utility Functions
        function updateStatus(message, type = 'info') {
            statusContainer.className = `alert alert-${type}`;
            statusText.textContent = message;
        }

        function updateConnectionStatus(connected, message = '') {
            isConnected = connected;
            
            if (connected) {
                statusIndicator.className = 'status-indicator status-connected';
                statusTextSpan.textContent = 'Connected';
                startBtn.disabled = true;
                stopBtn.disabled = false;
                sendMessageBtn.disabled = false;
                updateStatus('WhatsApp bot is connected and ready', 'success');
            } else {
                statusIndicator.className = 'status-indicator status-disconnected';
                statusTextSpan.textContent = 'Disconnected';
                startBtn.disabled = false;
                stopBtn.disabled = true;
                sendMessageBtn.disabled = true;
                updateStatus(message || 'WhatsApp bot is not connected', 'warning');
            }
        }

        function addToLog(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = document.createElement('div');
            logEntry.className = `mb-2 p-2 rounded ${type === 'error' ? 'bg-danger text-white' : type === 'success' ? 'bg-success text-white' : 'bg-white'}`;
            logEntry.innerHTML = `<small class="opacity-75">[${timestamp}]</small> ${message}`;
            
            // Remove placeholder if exists
            const placeholder = messageLog.querySelector('.text-muted.text-center');
            if (placeholder) placeholder.remove();
            
            messageLog.appendChild(logEntry);
            messageLog.scrollTop = messageLog.scrollHeight;
        }

        // API Functions
        async function checkStatus() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();
                
                if (data.status === 'ready') {
                    updateConnectionStatus(true);
                    qrSection.classList.add('d-none');
                } else if (data.status === 'qr_ready' && data.hasQR) {
                    updateConnectionStatus(false, 'QR code ready - please scan');
                    await loadQRCode();
                } else {
                    updateConnectionStatus(false, `Status: ${data.status}`);
                    qrSection.classList.add('d-none');
                }
            } catch (error) {
                updateConnectionStatus(false, 'Failed to check status');
                addToLog(`Status check failed: ${error.message}`, 'error');
            }
        }

        async function loadQRCode() {
            try {
                const response = await fetch('/api/qr');
                const data = await response.json();
                
                if (data.qr) {
                    qrContainer.innerHTML = `<img src="${data.qr}" alt="QR Code" class="img-fluid" style="max-width: 300px;">`;
                    qrSection.classList.remove('d-none');
                } else {
                    qrContainer.innerHTML = '<p class="text-muted">QR code not available</p>';
                }
            } catch (error) {
                qrContainer.innerHTML = '<p class="text-danger">Failed to load QR code</p>';
                addToLog(`QR load failed: ${error.message}`, 'error');
            }
        }

        async function startBot() {
            try {
                startBtn.disabled = true;
                startBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Starting...';
                
                const response = await fetch('/api/start', { method: 'POST' });
                const data = await response.json();
                
                addToLog(data.message, 'success');
                
                // Start checking status more frequently
                if (checkInterval) clearInterval(checkInterval);
                checkInterval = setInterval(checkStatus, 2000);
                
            } catch (error) {
                addToLog(`Start failed: ${error.message}`, 'error');
            } finally {
                startBtn.innerHTML = '<i class="fas fa-play me-2"></i>Start Bot';
                startBtn.disabled = false;
            }
        }

        async function stopBot() {
            try {
                stopBtn.disabled = true;
                stopBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Stopping...';
                
                const response = await fetch('/api/stop', { method: 'POST' });
                const data = await response.json();
                
                addToLog(data.message, 'success');
                updateConnectionStatus(false, 'Bot stopped');
                qrSection.classList.add('d-none');
                
            } catch (error) {
                addToLog(`Stop failed: ${error.message}`, 'error');
            } finally {
                stopBtn.innerHTML = '<i class="fas fa-stop me-2"></i>Stop Bot';
                stopBtn.disabled = false;
            }
        }

        async function sendMessage() {
            const phoneNumber = document.getElementById('phone-number').value.trim();
            const message = document.getElementById('test-message').value.trim();
            
            if (!phoneNumber || !message) {
                addToLog('Please enter both phone number and message', 'error');
                return;
            }
            
            try {
                sendMessageBtn.disabled = true;
                sendMessageBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Sending...';
                
                const response = await fetch('/api/send-message', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ number: phoneNumber, message })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    addToLog(`Message sent to ${phoneNumber}`, 'success');
                    document.getElementById('test-message').value = '';
                } else {
                    addToLog(`Send failed: ${data.error}`, 'error');
                }
                
            } catch (error) {
                addToLog(`Send failed: ${error.message}`, 'error');
            } finally {
                sendMessageBtn.innerHTML = '<i class="fas fa-paper-plane me-2"></i>Send Message';
                sendMessageBtn.disabled = !isConnected;
            }
        }

        async function loadKnowledgeBase() {
            try {
                const response = await fetch('/api/knowledge-base');
                const data = await response.json();
                
                if (data.content) {
                    document.getElementById('knowledge-base').value = data.content;
                    addToLog('Knowledge base loaded', 'success');
                } else {
                    addToLog('No knowledge base content found', 'info');
                }
            } catch (error) {
                addToLog(`KB load failed: ${error.message}`, 'error');
            }
        }

        async function saveKnowledgeBase() {
            const content = document.getElementById('knowledge-base').value.trim();
            
            if (!content) {
                addToLog('Please enter knowledge base content', 'error');
                return;
            }
            
            try {
                const response = await fetch('/api/knowledge-base', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    addToLog('Knowledge base saved successfully', 'success');
                } else {
                    addToLog(`Save failed: ${data.error}`, 'error');
                }
            } catch (error) {
                addToLog(`Save failed: ${error.message}`, 'error');
            }
        }

        function clearLog() {
            messageLog.innerHTML = `
                <div class="text-muted text-center">
                    <i class="fas fa-info-circle me-2"></i>
                    Activity log cleared - new messages will appear here...
                </div>
            `;
        }

        // Event Listeners
        startBtn.addEventListener('click', startBot);
        stopBtn.addEventListener('click', stopBot);
        refreshBtn.addEventListener('click', checkStatus);
        sendMessageBtn.addEventListener('click', sendMessage);
        loadKbBtn.addEventListener('click', loadKnowledgeBase);
        saveKbBtn.addEventListener('click', saveKnowledgeBase);
        clearLogBtn.addEventListener('click', clearLog);

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            addToLog('Dashboard loaded - checking connection status...', 'info');
            checkStatus();
            
            // Check status every 10 seconds
            checkInterval = setInterval(checkStatus, 10000);
        });
    </script>
</body>
</html>
